    <script>
        // === КОНФИГУРАЦИЯ ===
        const DB_FILE_NAME = 'signatures_db.json';
        const IDB_NAME = 'UL_Signatures_DB';
        const IDB_STORE = 'handles';
        
        let localDirHandle = null;
        let localFileHandle = null;
        
        // Supabase инициализируется лениво (только когда нужен)
        let supabaseClient = null;
        const SUPABASE_URL = 'https://znbfhfyjgzuojreohquq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__4DGsW8B7D0sKxnwDVPf2Q_Zbav1l87';

        window.signatureDatabase = {};

        // === DOM ELEMENTS ===
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");
        const uploadBtn = document.getElementById("uploadBtn");
        const processBtn = document.getElementById("processBtn");
        const fileListContainer = document.getElementById("fileListContainer");
        const fileListBody = document.getElementById("fileListBody");
        const duplicateAlert = document.getElementById("duplicateAlert");
        const fileInfo = document.getElementById("fileInfo");
        const fileNameEl = document.getElementById("fileName");
        const fileSizeEl = document.getElementById("fileSize");
        const pageCountEl = document.getElementById("pageCount");
        const uploadDateEl = document.getElementById("uploadDate");
        const resultsSection = document.getElementById("resultsSection");
        const multiPreviewContainer = document.getElementById("multiPreviewContainer");
        const resetBtn = document.getElementById("resetBtn");
        const progressBar = document.getElementById("progressBar");
        const progressPercent = document.getElementById("progressPercent");
        const progressContainer = document.getElementById("progressContainer");
        const zipBtnContainer = document.getElementById("zipBtnContainer");
        const downloadZipBtn = document.getElementById("downloadZipBtn");
        const modeIndicator = document.getElementById("modeIndicator");

        let selectedFiles = [];
        let processedResults = [];
        let allProcessedBlobs = [];
        let duplicateFilesLog = [];

        function formatFileSize(bytes) {
            if (bytes === 0) return "0 Байт";
            const k = 1024;
            const sizes = ["Байт", "КБ", "МБ", "ГБ"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        function updateProgress(percent, message) {
            const rounded = Math.round(percent);
            progressBar.value = rounded;
            progressPercent.textContent = message ? `${message} (${rounded}%)` : `${rounded}%`;
        }
        function showProgress() { progressContainer.style.display = "block"; }
        function hideProgress() { progressContainer.style.display = "none"; }

        uploadBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", handleFileSelection);
        uploadArea.addEventListener("dragover", (e) => { e.preventDefault(); uploadArea.classList.add("active"); });
        uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("active"));
        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault(); uploadArea.classList.remove("active");
            if (e.dataTransfer.files.length) {
                const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith(".docx"));
                if (files.length === 0) { alert("Перетащите DOCX файлы!"); return; }
                addFiles(files);
            }
        });
        if (processBtn) processBtn.addEventListener("click", startProcessing);
        resetBtn.addEventListener("click", resetApp);
        if (downloadZipBtn) downloadZipBtn.addEventListener("click", downloadAllAsZip);

        function handleFileSelection() {
            const newFiles = Array.from(fileInput.files).filter(f => f.name.endsWith(".docx"));
            if (newFiles.length === 0) return;
            addFiles(newFiles); fileInput.value = "";
        }

        function addFiles(newFiles) {
            duplicateFilesLog = [];
            if (selectedFiles.length + newFiles.length > 20) {
                alert("Можно загрузить не более 20 файлов.");
                newFiles = newFiles.slice(0, 20 - selectedFiles.length);
            }
            const existingNames = new Set(selectedFiles.map(f => f.name));
            const filteredFiles = [];
            for (const file of newFiles) {
                if (existingNames.has(file.name)) duplicateFilesLog.push(file.name);
                else { existingNames.add(file.name); filteredFiles.push(file); }
            }
            if (duplicateFilesLog.length > 0) {
                duplicateAlert.innerHTML = `<div class="duplicate-alert"><strong>⚠️ Обнаружены дубликаты!</strong><ul>${duplicateFilesLog.map(f => `<li>${f}</li>`).join('')}</ul></div>`;
            } else duplicateAlert.innerHTML = '';
            selectedFiles = selectedFiles.concat(filteredFiles);
            updateFileListDisplay();
        }

        function getFileBadge(type) { return type === "docx" ? '<span class="file-type-badge badge-docx">DOCX</span>' : ''; }

        function updateFileListDisplay() {
            if (selectedFiles.length === 0) { processBtn.style.display = "none"; fileListContainer.style.display = "none"; return; }
            processBtn.style.display = "inline-flex"; fileListContainer.style.display = "block";
            fileListBody.innerHTML = "";
            selectedFiles.forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const row = document.createElement("tr");
                row.innerHTML = `<td>${getFileBadge(ext)}${file.name}</td><td style="text-align:right;">${formatFileSize(file.size)}</td>`;
                fileListBody.appendChild(row);
            });
            fileNameEl.textContent = selectedFiles.length === 1 ? selectedFiles[0].name : `Выбрано файлов: ${selectedFiles.length}`;
            fileSizeEl.textContent = formatFileSize(selectedFiles.reduce((sum, f) => sum + f.size, 0));
            uploadDateEl.textContent = new Date().toLocaleDateString("ru-RU");
            pageCountEl.textContent = "—";
            fileInfo.classList.add("active");
        }

        function extractIulNameFromText(plainText) {
            const patterns = [/\b(\d{3}-\d{4}-[А-ЯЁA-Z]{2,3}-\d+-[А-ЯЁA-ZHН]-\d+\.\d+-[А-ЯЁA-Z\d]+(?:\.\d+)?)/i];
            for (const pattern of patterns) {
                const match = plainText.match(pattern);
                if (match) {
                    let cleanCode = match[1].replace(/\s+/g, "").trim();
                    cleanCode = cleanCode.replace(/IOC/g, "ОК").replace(/ИОС/g, "ОК");
                    cleanCode = cleanCode.replace(/_?УЛ$/i, "");
                    return `${cleanCode}_УЛ`;
                }
            }
            return null;
        }

        function sanitizeFileName(name) {
            let cleaned = name.replace(/\s*\b\d{2}[.\-]\d{2}[.\-]\d{2,4}\b/g, '').trim();
            cleaned = cleaned.replace(/\.pdf/gi, '').replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').replace(/\s+/g, ' ').trim();
            return cleaned;
        }

        async function optimizeSignatureImage(file, maxW = 400, maxH = 200) {
            const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
            const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
            const srcCanvas = document.createElement("canvas"); srcCanvas.width = img.naturalWidth; srcCanvas.height = img.naturalHeight;
            const ctx = srcCanvas.getContext("2d"); ctx.drawImage(img, 0, 0);
            const { data } = ctx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
            let minX = srcCanvas.width, minY = srcCanvas.height, maxX = -1, maxY = -1;
            for (let y = 0; y < srcCanvas.height; y++) {
                for (let x = 0; x < srcCanvas.width; x++) {
                    const idx = (y * srcCanvas.width + x) * 4; const a = data[idx + 3];
                    const isWhite = data[idx] > 245 && data[idx + 1] > 245 && data[idx + 2] > 245;
                    if (a > 10 && !isWhite) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
                }
            }
            if (maxX < 0) { minX = 0; minY = 0; maxX = srcCanvas.width - 1; maxY = srcCanvas.height - 1; }
            const cropW = maxX - minX + 1, cropH = maxY - minY + 1;
            const scale = Math.min(1, maxW / cropW, maxH / cropH);
            const outW = Math.max(1, Math.round(cropW * scale)), outH = Math.max(1, Math.round(cropH * scale));
            const outCanvas = document.createElement("canvas"); outCanvas.width = outW; outCanvas.height = outH;
            outCanvas.getContext("2d").drawImage(srcCanvas, minX, minY, cropW, cropH, 0, 0, outW, outH);
            return outCanvas.toDataURL("image/png");
        }

        // === INDEXEDDB ===
        function openIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(IDB_NAME, 1);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
                };
                request.onsuccess = (event) => resolve(event.target.result);
                request.onerror = (event) => reject(event.target.error);
            });
        }

        async function saveHandleToIDB(handle) {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                const store = tx.objectStore(IDB_STORE);
                const request = store.put(handle, 'localDirHandle');
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function getHandleFromIDB() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const store = tx.objectStore(IDB_STORE);
                const request = store.get('localDirHandle');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function clearHandleFromIDB() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                const store = tx.objectStore(IDB_STORE);
                const request = store.delete('localDirHandle');
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // === ЛОКАЛЬНАЯ ПАПКА ===
        const isFileSystemSupported = 'showDirectoryPicker' in window;

        async function selectLocalFolder() {
            if (!isFileSystemSupported) {
                alert("Ваш браузер не поддерживает прямую работу с папками. Используйте Chrome или Edge.");
                return false;
            }
            try {
                localDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                localFileHandle = await localDirHandle.getFileHandle(DB_FILE_NAME, { create: true });
                await saveHandleToIDB(localDirHandle);
                await loadFromLocalFile();
                updateStorageStatusUI();
                return true;
            } catch (err) {
                console.error("Ошибка выбора папки:", err);
                if (err.name !== 'AbortError') alert("Не удалось получить доступ к папке.");
                return false;
            }
        }

        async function loadFromLocalFile() {
            if (!localFileHandle) return;
            try {
                const file = await localFileHandle.getFile();
                const text = await file.text();
                if (text.trim()) {
                    const parsed = JSON.parse(text);
                    window.signatureDatabase = { ...window.signatureDatabase, ...parsed };
                    console.log(`✅ Загружено ${Object.keys(parsed).length} подписей из ${DB_FILE_NAME}`);
                }
            } catch (err) {
                console.warn("Файл пуст или поврежден.", err);
            }
        }

        async function saveToLocalFile() {
            if (!localFileHandle) return false;
            try {
                const writable = await localFileHandle.createWritable();
                await writable.write(JSON.stringify(window.signatureDatabase, null, 2));
                await writable.close();
                return true;
            } catch (err) {
                console.error("Ошибка записи на диск:", err);
                return false;
            }
        }

        // Мгновенное восстановление (без блокировки UI)
        async function tryRestoreLocalAccess() {
            if (!isFileSystemSupported) return;
            try {
                const storedHandle = await getHandleFromIDB();
                if (!storedHandle) return;

                // Проверяем разрешение без запроса (мгновенно)
                const permission = await storedHandle.queryPermission({ mode: 'readwrite' });
                
                if (permission === 'granted') {
                    localDirHandle = storedHandle;
                    localFileHandle = await localDirHandle.getFileHandle(DB_FILE_NAME, { create: true });
                    await loadFromLocalFile();
                    updateStorageStatusUI();
                } else {
                    // Запрашиваем разрешение (браузер покажет окно, но UI уже отрисован)
                    // Делаем это в фоне, не блокируя основной поток
                    setTimeout(async () => {
                        try {
                            const request = await storedHandle.requestPermission({ mode: 'readwrite' });
                            if (request === 'granted') {
                                localDirHandle = storedHandle;
                                localFileHandle = await localDirHandle.getFileHandle(DB_FILE_NAME, { create: true });
                                await loadFromLocalFile();
                                updateStorageStatusUI();
                                // Если модалка открыта, обновляем её
                                if (document.getElementById("signatureListModal")?.style.display === "flex") {
                                    renderSignaturesList();
                                }
                            }
                        } catch(e) { console.log("Доступ отклонен пользователем"); }
                    }, 100);
                }
            } catch (err) {
                console.error("Ошибка восстановления:", err);
                await clearHandleFromIDB();
            }
        }

        // === КОНВЕРТАЦИЯ ===
        async function convertDocxWithSignatures(file, overrideDateStr, manualSignatures = {}) {
            const hiddenArea = document.getElementById("hiddenRenderArea");
            try {
                hiddenArea.innerHTML = ''; hiddenArea.style.visibility = 'hidden';
                const arrayBuffer = await file.arrayBuffer();
                const mammothResult = await mammoth.convertToHtml({
                    arrayBuffer,
                    styleMap: ["p[style-name='Normal'] => p:fresh", "table => table.table-bordered:fresh", "tr => tr:fresh", "td => td:fresh", "th => th:fresh"]
                });

                let formattedDate = overrideDateStr || new Date().toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = mammothResult.value;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                const detectedIulTitle = extractIulNameFromText(plainText);

                const htmlContent = `
                    <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body { font-family: 'Times New Roman', serif; font-size: 12pt; color: #000; }
                        #docxContent { text-align: center !important; padding-top: 10px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: flex-start !important; }
                        table { border-collapse: collapse; width: 100%; margin: 0 auto !important; table-layout: auto; }
                        td, th { border: 1px solid #000 !important; padding: 3px 5px !important; font-size: 12pt !important; font-family: 'Times New Roman', serif !important; vertical-align: middle !important; text-align: center !important; word-wrap: break-word; min-width: 50px; }
                        p { font-size: 12pt !important; font-family: 'Times New Roman', serif !important; margin: 2px 0 !important; line-height: 1.2; text-align: center !important; }
                        h1, h2, h3, h4, h5, h6 { font-family: 'Times New Roman', serif !important; margin: 0 0 5px 0 !important; font-size: 12pt !important; line-height: 1.2; font-weight: bold; text-align: center !important; }
                        img { max-width: 80px; height: auto; display: inline-block; vertical-align: middle; margin: 0 auto; }
                        div, span { text-align: center !important; }
                    </style>
                    <div id="docxContent" style="width: 794px; background: #fff; padding: 10px 38px 38px 76px; font-family: 'Times New Roman', serif; font-size: 12pt; color: #000; overflow: hidden; text-align: center !important; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;">
                        ${mammothResult.value}
                    </div>`;

                hiddenArea.innerHTML = htmlContent; hiddenArea.style.visibility = 'visible';
                await new Promise(r => setTimeout(r, 600));
                const docxContent = document.getElementById("docxContent");
                if (!docxContent) throw new Error("Не удалось создать содержимое документа");

                const allElements = docxContent.querySelectorAll('*');
                allElements.forEach(el => {
                    el.style.textAlign = 'center';
                    if (el.tagName !== 'TABLE' && el.tagName !== 'TD' && el.tagName !== 'TH') { el.style.marginTop = '0'; el.style.marginBottom = '2px'; }
                    if (el.tagName === 'TABLE') { el.style.marginTop = '0'; el.style.marginBottom = '0'; el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
                });
                docxContent.querySelectorAll('p').forEach(p => { if (p.textContent.trim() === '') p.style.display = 'none'; });

                const tables = docxContent.querySelectorAll('table');
                const allSurnames = Object.keys(window.signatureDatabase);
                let missingSignatures = [];

                const stopWords = ['CRC32', 'ИОС', 'НОС', 'УЛ', 'ВЕРСИЯ', 'РАЗМЕР', 'БАЙТ', 'НАИМЕНОВАНИЕ ФАЙЛА', 'ДАТА ИЗМЕНЕНИЯ', 'ЛИСТ', 'ЛИСТОВ', 'ИНФОРМАЦИОННО'];

                tables.forEach((table, tableIndex) => {
                    table.style.marginTop = tableIndex === 0 ? '0' : '5px'; table.style.marginBottom = '0';
                    table.style.marginLeft = 'auto'; table.style.marginRight = 'auto'; table.style.textAlign = 'center';
                    
                    let sigColIndex = -1, dateColIndex = -1;
                    
                    for (const row of table.rows) {
                        for (let c = 0; c < row.cells.length; c++) {
                            const text = (row.cells[c].textContent || '').toUpperCase().trim();
                            if (text === 'ПОДПИСЬ' || text.includes('ПОДПИС')) sigColIndex = c;
                            if (text === 'ДАТА' || text.includes('ДАТА')) dateColIndex = c;
                        }
                        if (sigColIndex !== -1) break;
                    }

                    if (sigColIndex === -1) return;

                    for (const row of table.rows) {
                        const rowTextUpper = row.textContent.toUpperCase();
                        
                        let isMetaDataRow = false;
                        for (const word of stopWords) {
                            if (rowTextUpper.includes(word)) { isMetaDataRow = true; break; }
                        }
                        if (rowTextUpper.includes('ХАРАКТЕР') || rowTextUpper.includes('ФИО') || isMetaDataRow) continue;
                        if (!row.cells[sigColIndex]) continue;

                        for (let c = 0; c < row.cells.length; c++) { 
                            row.cells[c].style.textAlign = 'center'; 
                            row.cells[c].style.verticalAlign = 'middle'; 
                        }
                        
                        const rowTextRaw = row.textContent;
                        let foundSurnameKey = null;
                        let matchedInitial = null;
                        let cleanRowName = "";

                        for (const key of allSurnames) {
                            if (key.includes(' ')) {
                                const parts = key.split(' ');
                                const surnamePart = parts[0];
                                const initialPart = parts[1];
                                const regex = new RegExp(`${surnamePart}[\\s\\.\\-]*${initialPart}`, 'i');
                                if (regex.test(rowTextRaw)) {
                                    foundSurnameKey = key;
                                    matchedInitial = initialPart;
                                    cleanRowName = surnamePart;
                                    break;
                                }
                            }
                        }

                        if (!foundSurnameKey) {
                            foundSurnameKey = allSurnames.find(s => {
                                if (s.includes(' ')) return false;
                                return rowTextUpper.includes(s);
                            });
                            if (foundSurnameKey) cleanRowName = foundSurnameKey;
                        }

                        let manualSigData = null;
                        if (!foundSurnameKey) {
                            for (const [mKey, mData] of Object.entries(manualSignatures)) {
                                if (rowTextRaw.includes(mKey) || mKey.includes(cleanRowName)) {
                                    manualSigData = mData;
                                    if (!cleanRowName) cleanRowName = mKey.split(' ')[0]; 
                                    break;
                                }
                            }
                        }

                        const sigCell = row.cells[sigColIndex];
                        
                        if (foundSurnameKey || manualSigData) {
                            const img = new Image(); 
                            img.src = foundSurnameKey ? window.signatureDatabase[foundSurnameKey] : manualSigData;
                            img.style.maxWidth = '80px'; img.style.maxHeight = '40px'; img.style.width = 'auto'; img.style.height = 'auto';
                            img.style.display = 'inline-block'; img.style.verticalAlign = 'middle';
                            sigCell.innerHTML = ''; 
                            sigCell.appendChild(img); 
                            
                            let initToClean = matchedInitial;
                            if (!initToClean && sigColIndex > 0 && row.cells[sigColIndex-1]) {
                                const fioText = row.cells[sigColIndex-1].textContent.trim();
                                const matchInit = fioText.match(/\s+([А-ЯЁ])\.?\s*$/);
                                if (matchInit) initToClean = matchInit[1];
                            }

                            if (initToClean) {
                                for (let k = 0; k < row.cells.length; k++) {
                                    if (k !== sigColIndex && row.cells[k]) {
                                        let cellContent = row.cells[k].textContent;
                                        const regexClean = new RegExp(`[\\s\\-\\.]*${initToClean}\\.?`, 'gi');
                                        row.cells[k].textContent = cellContent.replace(regexClean, '').trim();
                                    }
                                }
                            }
                        } else {
                            let displayName = "Неизвестный";
                            if (sigColIndex > 0 && row.cells[sigColIndex-1]) {
                                displayName = row.cells[sigColIndex-1].textContent.trim();
                            }
                            const rowId = `row_${tableIndex}_${Array.from(table.rows).indexOf(row)}`;
                            missingSignatures.push({
                                id: rowId,
                                name: displayName,
                                rawText: rowTextRaw.trim().substring(0, 60)
                            });
                        }

                        if (dateColIndex !== -1 && row.cells[dateColIndex]) {
                            const cell = row.cells[dateColIndex];
                            const cellText = cell.textContent.trim();
                            if (cellText === '' || cellText === 'Дата подписания') { 
                                cell.textContent = formattedDate; 
                                cell.style.textAlign = 'center'; 
                            }
                        }
                    }
                });

                await new Promise(r => setTimeout(r, 300));
                const canvas = await html2canvas(docxContent, { scale: 2.0, useCORS: true, logging: false, backgroundColor: "#ffffff", allowTaint: true, windowWidth: 794, windowHeight: docxContent.scrollHeight });
                
                const ctx = canvas.getContext('2d'); const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let topContentY = 0;
                for (let y = 0; y < canvas.height; y++) {
                    let hasContent = false;
                    for (let x = 0; x < canvas.width; x++) {
                        const index = (y * canvas.width + x) * 4;
                        if (imageData.data[index] < 250 || imageData.data[index + 1] < 250 || imageData.data[index + 2] < 250) { hasContent = true; break; }
                    }
                    if (hasContent) { topContentY = Math.max(0, y - 10); break; }
                }
                let finalCanvas = canvas;
                if (topContentY > 0) {
                    const trimmedCanvas = document.createElement('canvas'); trimmedCanvas.width = canvas.width; trimmedCanvas.height = canvas.height - topContentY;
                    const trimmedCtx = trimmedCanvas.getContext('2d');
                    trimmedCtx.drawImage(canvas, 0, topContentY, canvas.width, canvas.height - topContentY, 0, 0, canvas.width, canvas.height - topContentY);
                    finalCanvas = trimmedCanvas;
                }

                hiddenArea.style.visibility = 'hidden'; hiddenArea.innerHTML = '';
                const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
                const pageWidth = pdf.internal.pageSize.getWidth(); const pageHeight = pdf.internal.pageSize.getHeight();
                const imgData = finalCanvas.toDataURL('image/jpeg', 0.92);
                const imgProps = pdf.getImageProperties(imgData);
                const pdfImgHeight = (imgProps.height * pageWidth) / imgProps.width;

                if (pdfImgHeight <= pageHeight) {
                    pdf.addImage(imgData, 'JPEG', 0, 10, pageWidth, pdfImgHeight);
                } else {
                    let heightLeft = pdfImgHeight; let position = 10;
                    pdf.addImage(imgData, 'JPEG', 0, position, pageWidth, pdfImgHeight);
                    heightLeft -= (pageHeight - 10);
                    while (heightLeft > 0) {
                        position = heightLeft - pdfImgHeight; pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, pageWidth, pdfImgHeight);
                        heightLeft -= pageHeight;
                    }
                }

                const pdfBlob = pdf.output("blob");
                let outputFileName;
                if (detectedIulTitle) outputFileName = sanitizeFileName(detectedIulTitle) + ".pdf";
                else {
                    const baseName = file.name.replace(/\.[^.]+$/, "").replace(/_подписан/gi, "").trim();
                    outputFileName = sanitizeFileName(baseName) + "_УЛ.pdf";
                }

                return { 
                    pdfBlob, 
                    outputFileName, 
                    canvases: [finalCanvas], 
                    conversionSuccess: true, 
                    originalName: file.name, 
                    converted: true, 
                    totalPages: Math.ceil(pdfImgHeight / pageHeight), 
                    detectedIulTitle, 
                    overrideDatePerFile: formattedDate,
                    missingSignatures: missingSignatures
                };
            } catch (err) {
                console.error("DOCX conversion error:", err); hiddenArea.innerHTML = ''; hiddenArea.style.visibility = 'hidden'; throw err;
            }
        }

        async function startProcessing() {
            if (selectedFiles.length === 0) return;
            clearHiddenArea(); processedResults = []; allProcessedBlobs = []; multiPreviewContainer.innerHTML = ""; zipBtnContainer.style.display = "none";
            processBtn.disabled = true; processBtn.classList.add("processing"); showProgress();
            
            const sessionManualSigs = {};

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i]; clearHiddenArea();
                if (file.name.endsWith('.docx')) {
                    updateProgress((i / selectedFiles.length) * 100, `Обработка: ${file.name}`);
                    try {
                        const fileManualSigs = sessionManualSigs[i] || {};
                        const result = await convertDocxWithSignatures(file, null, fileManualSigs);
                        
                        if (result) {
                            result.fileIndex = i;
                            result.manualSigsStore = fileManualSigs;
                            processedResults.push(result); 
                            allProcessedBlobs.push({ blob: result.pdfBlob, fileName: result.outputFileName, displayName: result.detectedIulTitle || file.name });
                        }
                    } catch (err) { alert(`❌ Не удалось обработать ${file.name}: ${err.message}`); }
                }
                clearHiddenArea();
            }
            updateProgress(100, "Готово!"); renderMultiPreview();
            if (allProcessedBlobs.length > 0) zipBtnContainer.style.display = "block";
            setTimeout(hideProgress, 500); processBtn.disabled = false; processBtn.classList.remove("processing"); resultsSection.classList.add("active");
        }

        function clearHiddenArea() { const h = document.getElementById("hiddenRenderArea"); if (h) { h.innerHTML = ''; h.style.visibility = 'hidden'; } }
        
        async function reprocessSingleFile(fileIndex, newDateStr = null, newManualSig = null, rowId = null) {
            const file = selectedFiles[fileIndex];
            const existingResult = processedResults.find(r => r.fileIndex === fileIndex);
            
            if (newManualSig && rowId && existingResult) {
                if (!existingResult.manualSigsStore) existingResult.manualSigsStore = {};
                const missingSig = existingResult.missingSignatures.find(m => m.id === rowId);
                if (missingSig) {
                    existingResult.manualSigsStore[missingSig.rawText] = newManualSig;
                }
            }

            const dateToUse = newDateStr || existingResult?.overrideDatePerFile;
            const manualSigsToUse = existingResult?.manualSigsStore || {};

            try {
                const newResult = await convertDocxWithSignatures(file, dateToUse, manualSigsToUse);
                if (newResult) {
                    newResult.fileIndex = fileIndex;
                    newResult.manualSigsStore = manualSigsToUse;
                    
                    const idx = processedResults.findIndex(r => r.fileIndex === fileIndex);
                    if (idx !== -1) processedResults[idx] = newResult;
                    
                    if (allProcessedBlobs[idx]) {
                        allProcessedBlobs[idx].blob = newResult.pdfBlob;
                        allProcessedBlobs[idx].fileName = newResult.outputFileName;
                    }
                    
                    renderMultiPreview();
                }
            } catch (err) {
                console.error("Reprocess error:", err);
                alert("Ошибка при обновлении документа");
            }
        }

        function renderMultiPreview() {

                const { canvases, originalName, converted, overrideDatePerFile, totalPages, detectedIulTitle, outputFileName, missingSignatures, fileIndex } = result;

                    clone.getContext("2d").drawImage(canvas, 0, 0); clone.style.maxWidth = "100%";
                    wrapper.appendChild(clone); content.appendChild(wrapper);
                });

                if (missingSignatures && missingSignatures.length > 0) {
                    const panel = document.createElement("div");
                    panel.className = "missing-sigs-panel";
                    panel.innerHTML = `<div class="missing-sigs-title">⚠️ Не найдены подписи для:</div>`;
                    
                    missingSignatures.forEach(sig => {
                        const item = document.createElement("div");
                        item.className = "missing-sig-item";
                        item.innerHTML = `
                            <span class="missing-sig-name">${sig.name}</span>
                            <button class="btn btn-orange" style="padding: 4px 12px; font-size: 11px;" data-row-id="${sig.id}" data-file-idx="${fileIndex}">📎 Загрузить PNG</button>
                        `;
                        panel.appendChild(item);
                    });
                    content.appendChild(panel);

                    panel.querySelectorAll('button').forEach(btn => {
                        btn.onclick = async (e) => {
                            const rowId = e.target.getAttribute('data-row-id');
                            const fIdx = parseInt(e.target.getAttribute('data-file-idx'));
                            
                            const input = document.createElement('input');
                            input.type = 'file';
                            input.accept = 'image/png,image/jpeg,image/jpg';
                            input.onchange = async (ev) => {
                                const f = ev.target.files[0];
                                if (f) {
                                    try {
                                        e.target.textContent = "⏳ Обработка...";
                                        e.target.disabled = true;
                                        const dataUrl = await optimizeSignatureImage(f);
                                        await reprocessSingleFile(fIdx, null, dataUrl, rowId);
                                    } catch (err) {
                                        alert("Ошибка загрузки изображения");
                                        e.target.textContent = "📎 Загрузить PNG";
                                        e.target.disabled = false;
                                    }
                                }
                            };
                            input.click();
                        };
                    });
                }

                const dateControl = document.createElement("div"); dateControl.className = "date-control";
                const dateLabel = document.createElement("label"); dateLabel.textContent = "Дата:";
                const dateInput = document.createElement("input"); dateInput.type = "date";
                const [day, month, year] = (overrideDatePerFile || "").split('.');
                if (year && month && day) dateInput.value = `${year}-${month}-${day}`; else dateInput.value = new Date().toISOString().split('T')[0];
                const resetDateBtn = document.createElement("button"); resetDateBtn.textContent = "↻"; resetDateBtn.className = "reset-date-btn";
                dateControl.appendChild(dateLabel); dateControl.appendChild(dateInput); dateControl.appendChild(resetDateBtn);
                
                const handleDateChange = async (newDateStr) => {
                    await reprocessSingleFile(fileIndex, newDateStr);
                };
                dateInput.addEventListener("change", () => { if (!dateInput.value) return; const d = new Date(dateInput.value); handleDateChange(d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" })); });
                resetDateBtn.addEventListener("click", () => { const t = new Date(); dateInput.value = t.toISOString().split('T')[0]; handleDateChange(t.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" })); });
                content.appendChild(dateControl);

                const downloadBtn = document.createElement("button"); downloadBtn.className = "btn"; downloadBtn.textContent = "Скачать PDF"; downloadBtn.style.marginTop = "10px";
                downloadBtn.onclick = () => { const url = URL.createObjectURL(result.pdfBlob); const a = document.createElement("a"); a.href = url; a.download = result.outputFileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
                content.appendChild(downloadBtn); 

                block.appendChild(header); block.appendChild(content); multiPreviewContainer.appendChild(block);
                header.onclick = () => { const isCollapsed = content.style.display === "none"; content.style.display = isCollapsed ? "block" : "none"; header.querySelector(".toggle-icon").textContent = isCollapsed ? "▼" : "▲"; };
            });
            multiPreviewContainer.style.display = "block";
        }

        async function downloadAllAsZip() {
            if (allProcessedBlobs.length === 0) { alert("Нет обработанных файлов."); return; }
            downloadZipBtn.disabled = true; downloadZipBtn.textContent = "⏳ Создание архива...";
            try {
                const zip = new JSZip(); const nameCounts = {};
                for (const item of allProcessedBlobs) {
                    let fn = item.fileName; if (nameCounts[fn]) { nameCounts[fn]++; const ext = fn.lastIndexOf('.'); fn = `${fn.substring(0, ext)} (${nameCounts[fn]})${fn.substring(ext)}`; } else nameCounts[fn] = 1;
                    zip.file(fn, item.blob);
                }
                const zipBlob = await zip.generateAsync({ type: "blob" }); const url = URL.createObjectURL(zipBlob);
                const a = document.createElement("a"); a.href = url; a.download = "УЛ_подписанные.zip"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            } catch (err) { alert(`❌ Ошибка создания архива: ${err.message}`); }
            downloadZipBtn.disabled = false; downloadZipBtn.textContent = "📦 Скачать все в ZIP-архиве";
        }

        function resetApp() {
            fileInput.value = ""; selectedFiles = []; processedResults = []; allProcessedBlobs = []; duplicateFilesLog = []; duplicateAlert.innerHTML = '';
            updateFileListDisplay(); if (multiPreviewContainer) { multiPreviewContainer.innerHTML = ""; multiPreviewContainer.style.display = "none"; }
            fileNameEl.textContent = "—"; fileSizeEl.textContent = "—"; pageCountEl.textContent = "—"; uploadDateEl.textContent = "—";
            zipBtnContainer.style.display = "none"; if (fileInfo) fileInfo.classList.remove("active"); if (resultsSection) resultsSection.classList.remove("active");
            hideProgress(); clearHiddenArea();
        }

        // === УПРАВЛЕНИЕ ПОДПИСЯМИ ===

        async function persistSignature(surname, dataUrl) {
            window.signatureDatabase[surname.toUpperCase()] = dataUrl;
            
            // 1. Диск (приоритет, мгновенно)
            let diskSaved = false;
            if (localFileHandle) diskSaved = await saveToLocalFile();

            // 2. Облако (фон, не блокирует)
            if (!diskSaved) {
                const client = getSupabaseClient();
                if (client) {
                    client.from('signatures').upsert({ 
                        surname: surname.toUpperCase(), 
                        image_url: dataUrl 
                    }, { onConflict: 'surname' }).then(({error}) => {
                        if (!error) console.log("Saved to Supabase");
                    }).catch(() => {});
                }
            }

            if (diskSaved) return { status: "disk_saved", msg: `✅ Подпись ${surname} сохранена в папку ${localDirHandle.name}` };
            return { status: "memory_saved", msg: `✅ Подпись ${surname} сохранена. (Выберите папку для постоянного хранения)` };
        }

        async function removeSignaturePersisted(surname) {
            delete window.signatureDatabase[surname.toUpperCase()];
            
            let diskSaved = false;
            if (localFileHandle) diskSaved = await saveToLocalFile();

            if (!diskSaved) {
                const client = getSupabaseClient();
                if (client) {
                    client.from('signatures').delete().eq('surname', surname.toUpperCase()).then(() => {}).catch(() => {});
                }
            }

            if (diskSaved) return { status: "disk_deleted", msg: `🗑️ Подпись ${surname} удалена из папки ${localDirHandle.name}` };
            return { status: "memory_deleted", msg: `🗑️ Подпись ${surname} удалена.` };
        }

        function extractSurnameFromFilename(fileName) { return fileName.replace(/\.[^.]+$/, "").replace(/[_\-\s]+/g, " ").trim().toUpperCase(); }

        function initSignatureManager() {
            if (document.getElementById("signatureModal")) return;
            const modalHTML = `
                <div id="signatureModal" class="modal" style="display:none;">
                    <div class="modal-content">
                        <span id="closeModal" class="close">&times;</span>
                        <h3 class="modal-title">Добавить/обновить подпись <button type="button" id="surnameInfoBtn" class="info-icon-btn" title="Фамилия (кириллица, заглавные)">ℹ</button></h3>
                        <div id="surnameHint" class="hidden-hint">Фамилия (кириллица, заглавные):</div>
                        <div class="form-group">
                            <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;"><input type="checkbox" id="autoNameCheckbox" checked style="width:16px;height:16px;accent-color:#1a1a1a;" /><span>Брать фамилию из имени файла</span></label>
                            <div id="manualNameGroup" style="display:none;"><label style="font-size:12px;color:#555;text-transform:none;">Фамилия вручную:</label><input type="text" id="surnameInput" placeholder="Например: ИВАНОВ" maxlength="50" style="margin-top:4px;" /></div>
                            <div id="autoNameHint" style="font-size:12px;color:#555;margin-top:4px;">Файл <strong>ИВАНОВ.png</strong> → фамилия <strong>ИВАНОВ</strong></div>
                        </div>
                        <div class="form-group">
                            <label>Изображение подписи (PNG/JPG) - можно выбрать несколько:</label>
                            <input type="file" id="signatureFileInput" accept="image/png,image/jpeg,image/jpg" multiple />
                            <div id="filePreview" class="file-preview"></div>
                            <div id="massPreviewList" class="mass-preview-list" style="display:none;"></div>
                        </div>
                        <button id="saveSignatureBtn" class="btn">Сохранить подпись(и)</button>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            const closeModalBtn = document.getElementById("closeModal"); const infoBtn = document.getElementById("surnameInfoBtn");
            const hintEl = document.getElementById("surnameHint"); const autoCheckbox = document.getElementById("autoNameCheckbox");
            const manualGroup = document.getElementById("manualNameGroup"); const autoHint = document.getElementById("autoNameHint");
            const surnameInput = document.getElementById("surnameInput"); const sigFileInput = document.getElementById("signatureFileInput");
            const filePreview = document.getElementById("filePreview"); const massPreviewList = document.getElementById("massPreviewList");
            const saveBtn = document.getElementById("saveSignatureBtn");
            
            closeModalBtn.onclick = () => document.getElementById("signatureModal").style.display = "none";
            window.onclick = (e) => { if (e.target.id === "signatureModal") e.target.style.display = "none"; };
            
            let hintPinned = false;
            infoBtn.addEventListener("click", () => { hintPinned = !hintPinned; hintEl.classList.toggle("visible", hintPinned); });
            infoBtn.addEventListener("mouseenter", () => hintEl.classList.add("visible"));
            infoBtn.addEventListener("mouseleave", () => { if (!hintPinned) hintEl.classList.remove("visible"); });
            
            function toggleNameMode() { 
                const isAuto = autoCheckbox.checked; 
                manualGroup.style.display = isAuto ? "none" : "block"; 
                autoHint.style.display = isAuto ? "block" : "none"; 
                sigFileInput.multiple = isAuto;
                if (!isAuto) sigFileInput.value = "";
            }
            autoCheckbox.addEventListener("change", toggleNameMode); 
            toggleNameMode();

            sigFileInput.onchange = (e) => {
                filePreview.innerHTML = ""; 
                massPreviewList.innerHTML = "";
                massPreviewList.style.display = "none";
                
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (files.length === 1) {
                    const file = files[0];
                    if (file && file.type.startsWith("image/")) {
                        const reader = new FileReader(); 
                        reader.onload = ev => { const img = document.createElement("img"); img.src = ev.target.result; filePreview.appendChild(img); }; 
                        reader.readAsDataURL(file);
                        if (autoCheckbox.checked) { 
                            const autoName = extractSurnameFromFilename(file.name); 
                            autoHint.innerHTML = `Файл <strong>${file.name}</strong> → фамилия <strong>${autoName || "—"}</strong>`; 
                        }
                    }
                } else {
                    if (!autoCheckbox.checked) {
                        alert("Для массовой загрузки включите 'Брать фамилию из имени файла'");
                        sigFileInput.value = "";
                        return;
                    }
                    massPreviewList.style.display = "block";
                    files.forEach(file => {
                        const name = extractSurnameFromFilename(file.name);
                        const item = document.createElement("div");
                        item.className = "mass-preview-item";
                        item.innerHTML = `<span>📄 ${file.name}</span> <span style="color:#2a9d2a;">→ ${name}</span>`;
                        massPreviewList.appendChild(item);
                    });
                    autoHint.innerHTML = `Выбрано файлов: <strong>${files.length}</strong>. Фамилии будут взяты из имен файлов.`;
                }
            };

            saveBtn.onclick = async () => {
                const files = Array.from(sigFileInput.files);
                if (files.length === 0) { alert("Выберите изображение(я) подписи"); return; }
                
                for (const f of files) {
                    if (!f.type.match("image/(png|jpeg|jpg)")) { alert(`Файл ${f.name} не поддерживается (только PNG/JPG)`); return; }
                }

                saveBtn.disabled = true;
                saveBtn.textContent = "Обработка...";

                let successCount = 0;
                let errorCount = 0;
                let lastMsg = "";

                for (const file of files) {
                    let surname = autoCheckbox.checked ? extractSurnameFromFilename(file.name) : surnameInput.value.trim().toUpperCase();
                    
                    if (!surname) { errorCount++; continue; }
                    if (!/^[А-ЯЁA-Z\s\-]+$/i.test(surname)) { 
                        alert(`Фамилия "${surname}" из файла ${file.name} содержит недопустимые символы`); 
                        errorCount++; 
                        continue; 
                    }
                    surname = surname.replace(/\s+/g, " ").toUpperCase();

                    try {
                        const dataUrl = await optimizeSignatureImage(file);
                        const res = await persistSignature(surname, dataUrl);
                        if (res.status.includes("saved")) successCount++;
                        else errorCount++;
                        lastMsg = res.msg;
                    } catch (err) { 
                        console.error(err);
                        errorCount++; 
                    }
                }

                saveBtn.disabled = false;
                saveBtn.textContent = "Сохранить подпись(и)";
                surnameInput.value = ""; 
                sigFileInput.value = ""; 
                filePreview.innerHTML = ""; 
                massPreviewList.innerHTML = "";
                massPreviewList.style.display = "none";
                autoHint.innerHTML = `Файл <strong>ИВАНОВ.png</strong> → фамилия <strong>ИВАНОВ</strong>`;
                
                if (document.getElementById("signatureListModal")?.style.display === "flex") renderSignaturesList();
                
                if (files.length === 1) {
                    alert(lastMsg);
                } else {
                    alert(`✅ Массовая загрузка завершена.\nУспешно: ${successCount}\nОшибок: ${errorCount}`);
                }
            };
        }

        function initSignatureListModal() {
            if (document.getElementById("signatureListModal")) return;
            const modalHTML = `
                <div id="signatureListModal" class="modal" style="display:none;">
                    <div class="modal-content" style="max-width:650px;width:95%;">
                        <span id="closeListModal" class="close">&times;</span>
                        <h3>Список подписей (<span id="signaturesCount">0</span>)</h3>
                        <div id="storageStatus" class="storage-status"></div>
                        
                        <div class="storage-controls">
                            <button id="selectFolderBtn" class="btn" style="flex:1;min-width:100px;padding:8px;font-size:13px;">📁 Выбрать папку</button>
                            <button id="loadJsonBtn" class="btn" style="flex:1;min-width:100px;padding:8px;font-size:13px;">📂 Импорт JSON</button>
                        </div>

                        <div class="form-group"><input type="text" id="signatureSearch" placeholder="Поиск по фамилии..." style="width:100%;padding:8px;margin-bottom:12px;background:#fff;border:1px solid #b0b0b0;font-family:inherit;" /></div>
                        <div id="signaturesListContainer" class="signatures-list-container"></div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            document.getElementById("closeListModal").onclick = () => document.getElementById("signatureListModal").style.display = "none";
            document.getElementById("signatureListModal").onclick = (e) => { if (e.target === document.getElementById("signatureListModal")) e.target.style.display = "none"; };
            document.getElementById("signatureSearch").oninput = renderSignaturesList;

            document.getElementById("selectFolderBtn").onclick = async () => {
                await selectLocalFolder();
                renderSignaturesList();
            };

            document.getElementById("loadJsonBtn").onclick = () => {
                const input = document.createElement("input");
                input.type = "file"; input.accept = ".json,application/json";
                input.onchange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const parsed = JSON.parse(ev.target.result);
                            if (typeof parsed === 'object' && !Array.isArray(parsed)) {
                                window.signatureDatabase = { ...window.signatureDatabase, ...parsed };
                                if (localFileHandle) saveToLocalFile();
                                renderSignaturesList();
                                alert(`✅ Загружено ${Object.keys(parsed).length} подписей.`);
                            } else {
                                alert("❌ Неверный формат JSON файла.");
                            }
                        } catch (err) { alert("❌ Ошибка чтения JSON файла."); }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };
        }

        function renderSignaturesList() {
            const container = document.getElementById("signaturesListContainer"); const countEl = document.getElementById("signaturesCount");
            if (!container || !countEl) return; updateStorageStatusUI();
            const searchTerm = (document.getElementById("signatureSearch")?.value || "").trim().toUpperCase();
            const allSurnames = Object.keys(window.signatureDatabase).sort();
            const filtered = searchTerm ? allSurnames.filter(s => s.includes(searchTerm)) : allSurnames;
            countEl.textContent = filtered.length;
            if (filtered.length === 0) { container.innerHTML = `<p style='color:#555;text-align:center;'>${searchTerm ? 'Нет совпадений' : 'Нет подписей. Выберите папку для начала работы.'}</p>`; return; }
            container.innerHTML = filtered.map(surname => `
                <div class="signature-list-item">
                    <img src="${window.signatureDatabase[surname]}" alt="${surname}" onerror="this.style.display='none'">
                    <div class="surname">${surname}</div>
                    <button class="delete-signature-btn" onclick="deleteSignature('${surname.replace(/'/g, "\\'")}')">×</button>
                </div>`).join('');
        }

        async function deleteSignature(surname) {
            if (!confirm(`Удалить подпись ${surname}?`)) return;
            const res = await removeSignaturePersisted(surname); 
            renderSignaturesList();
            alert(res.msg);
        }

        async function handleLaunchMode() {
            const params = new URLSearchParams(window.location.search); const mode = params.get("mode");
            if (mode === "auto") {
                modeIndicator.textContent = "⚡ Режим РД: автоматическое подписание"; modeIndicator.className = "mode-indicator auto"; modeIndicator.style.display = "block";
                const stored = sessionStorage.getItem("signFiles");
                if (stored) {
                    try {
                        const filesData = JSON.parse(stored);
                        for (const fileData of filesData) {
                            const byteString = atob(fileData.data); const ab = new ArrayBuffer(byteString.length); const ia = new Uint8Array(ab);
                            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                            const blob = new Blob([ab], { type: fileData.type }); const file = new File([blob], fileData.name, { type: fileData.type });
                            selectedFiles.push(file);
                        }
                        updateFileListDisplay(); sessionStorage.removeItem("signFiles"); setTimeout(() => startProcessing(), 500);
                    } catch (err) { alert("❌ Не удалось загрузить файлы для автоматического подписания"); }
                } else alert("⚠️ Нет файлов для автоматического подписания");
            } else if (mode === "manual") {
                modeIndicator.textContent = "📝 Режим ПД: выберите файлы вручную"; modeIndicator.className = "mode-indicator manual"; modeIndicator.style.display = "block";
            }
        }

        // === МГНОВЕННЫЙ СТАРТ ===
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Сразу рисуем интерфейс (ничего не ждем)
            initSignatureManager(); 
            initSignatureListModal(); 
            handleLaunchMode();
            
            const listBtn = document.getElementById("signatureListBtn");
            if (listBtn) listBtn.onclick = () => { renderSignaturesList(); document.getElementById("signatureListModal").style.display = "flex"; };
            const logo = document.getElementById("clickableLogo");
            if (logo) logo.addEventListener("click", () => document.getElementById("signatureModal").style.display = "flex");

            // 2. Асинхронно восстанавливаем папку (не блокирует UI)
            tryRestoreLocalAccess().then(() => {
                // Если папка не подключена, пытаемся тихо подгрузить из Supabase в фоне
                if (!localDirHandle) {
                    const client = getSupabaseClient();
                    if (client) {
                        client.from('signatures').select('surname, image_url').then(({data}) => {
                            if (data) {
                                data.forEach(row => { window.signatureDatabase[row.surname.toUpperCase()] = row.image_url; });
                                // Обновляем UI если модалка открыта
                                if (document.getElementById("signatureListModal")?.style.display === "flex") {
                                    renderSignaturesList();
                                }
                            }
                        }).catch(() => {});
                    }
                }
            });
        });
    </script>
